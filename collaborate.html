<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIDLYPH Collaborate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/collaborate.css">
</head>
<body>
  <input type="checkbox" id="nav-toggle" class="nav-toggle">

  <header class="site-header">
    <label for="nav-toggle" class="menu-btn" aria-label="Open menu">
      <span></span><span></span><span></span>
    </label>

    <a href="index.html" class="logo" aria-label="VIDLYPH home">
      <img src="images/logo.png" alt="VIDLYPH">
    </a>
  </header>

  <nav class="sidebar" aria-label="Main navigation">
    <div class="sidebar-top">
      <div class="profile">
        <div class="avatar" role="img" aria-label="Profile picture placeholder"></div>
        <div>
          <p class="profile-name">Name</p>
          <p class="profile-desc">Description</p>
        </div>
      </div>
      <label for="nav-toggle" class="close-btn" aria-label="Close menu">×</label>
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="creators.html">Creators</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="collaborate.html">Collaborate</a></li>
    </ul>

    <a href="login.html" class="login">login</a>
  </nav>

  <label for="nav-toggle" class="overlay" aria-hidden="true"></label>

  <main class="collab-page">
    <section class="collab-heading">
      <h1>Start Collaborating</h1>
      <p>Find people to create with!</p>
    </section>

    <form class="collab-form" id="collab-form">
      <div class="form-group collab-name">
        <label for="name">Name</label>
        <input class="form-control" type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div class="form-group collab-field">
        <label for="creative-field">Creative Field</label>
        <select class="form-control" id="creative-field" name="creative-field" required>
          <option value="" selected disabled>select a field</option>
          <option value="animation">Animation</option>
          <option value="illustration">Illustration</option>
          <option value="video-editing">Video Editing</option>
          <option value="music">Music</option>
          <option value="graphic-design">Graphic Design</option>
          <option value="photography">Photography</option>
          <option value="writing">Writing</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group collab-description">
        <label for="project-description">Project description</label>
        <textarea class="form-control" id="project-description" name="project-description" required></textarea>
      </div>

      <button class="btn collab-submit" type="submit">Submit Request</button>
    </form>
  </main>
  
</body>
</html>
